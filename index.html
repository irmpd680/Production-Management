<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>奖惩数据公示仪表盘</title>
    <!-- ECharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js">
    </script>
    <!-- SheetJS CDN -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js">
    </script>
    <style>
        /* ===== 全局重置 & 变量 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #1a73e8;
            --primary-light: #e8f0fe;
            --danger: #d93025;
            --danger-light: #fce8e6;
            --success: #34a853;
            --warning: #f9ab00;
            --gray-50: #f8f9fa;
            --gray-100: #f1f3f4;
            --gray-200: #e8eaed;
            --gray-300: #dadce0;
            --gray-600: #5f6368;
            --gray-800: #202124;
            --radius: 16px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            --transition: 0.25s ease;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            font-family: var(--font);
            background: var(--gray-50);
            color: var(--gray-800);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .app {
            max-width: 430px;
            width: 100%;
            margin: 0 auto;
            background: #ffffff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px 16px 30px;
            transition: max-width 0.3s;
        }
        @media (min-width: 900px) {
            body {
                padding: 24px 40px;
                align-items: center;
            }
            .app {
                max-width: 1200px;
                padding: 28px 32px 36px;
            }
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, var(--primary), #0d47a1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 small {
            font-size: 14px;
            font-weight: 400;
            color: var(--gray-600);
            -webkit-text-fill-color: var(--gray-600);
        }
        .upload-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .upload-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .upload-btn:hover {
            background: #1557b0;
            transform: scale(1.02);
        }
        .upload-btn:active {
            transform: scale(0.96);
        }
        .upload-btn.secondary {
            background: var(--gray-600);
        }
        .upload-btn.secondary:hover {
            background: #4a4d52;
        }
        .upload-btn.danger {
            background: var(--danger);
        }
        .upload-btn.danger:hover {
            background: #b71c1c;
        }
        .file-name {
            font-size: 13px;
            color: var(--gray-600);
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ===== 筛选栏 ===== */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 14px;
            background: var(--gray-50);
            padding: 14px 16px;
            border-radius: var(--radius);
            margin-bottom: 18px;
            align-items: center;
            border: 1px solid var(--gray-200);
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }
        .filter-group label {
            color: var(--gray-600);
            font-weight: 500;
            white-space: nowrap;
        }
        .filter-group select {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--gray-300);
            background: #fff;
            font-size: 14px;
            color: var(--gray-800);
            cursor: pointer;
            outline: none;
            min-width: 70px;
        }
        .filter-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
        }
        .filter-group select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .filter-actions {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }
        .filter-actions .upload-btn {
            padding: 6px 16px;
            font-size: 13px;
        }

        /* ===== 统计卡片 (三列) ===== */
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }
        @media (max-width: 460px) {
            .stats {
                grid-template-columns: 1fr 1fr;
            }
            .stats .stat-card:last-child {
                grid-column: 1 / -1;
            }
        }
        @media (max-width: 360px) {
            .stats {
                grid-template-columns: 1fr;
            }
            .stats .stat-card:last-child {
                grid-column: 1;
            }
        }
        .stat-card {
            background: var(--gray-50);
            border-radius: var(--radius);
            padding: 12px 14px;
            border: 1px solid var(--gray-200);
            transition: var(--transition);
            position: relative;
        }
        .stat-card:hover {
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .stat-card .label {
            font-size: 12px;
            color: var(--gray-600);
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .stat-card .value {
            font-size: 26px;
            font-weight: 700;
            margin-top: 2px;
            line-height: 1.2;
        }
        .stat-card .value.primary {
            color: var(--primary);
        }
        .stat-card .value.danger {
            color: var(--danger);
        }
        .stat-card .value.success {
            color: var(--success);
        }
        .stat-card .sub {
            font-size: 12px;
            color: var(--gray-600);
            margin-top: 2px;
        }
        .stat-card .sub .highlight {
            font-weight: 600;
            color: var(--warning);
        }

        /* ===== 未确认名单 ===== */
        .unconfirm-list {
            background: var(--danger-light);
            border: 2px solid var(--danger);
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-bottom: 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
            animation: pulse-border 2s infinite;
        }
        .unconfirm-list .label {
            font-weight: 600;
            color: var(--danger);
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .unconfirm-list .label::before {
            content: "⚠️";
            font-size: 18px;
        }
        .unconfirm-list .names {
            font-weight: 600;
            color: var(--danger);
            font-size: 14px;
            word-break: break-all;
            line-height: 1.6;
        }
        .unconfirm-list .empty {
            color: var(--gray-600);
            font-weight: 400;
        }
        .unconfirm-list .name-tag {
            display: inline-block;
            background: rgba(217, 48, 37, 0.10);
            border-radius: 16px;
            padding: 2px 12px 2px 10px;
            margin: 2px 4px 2px 0;
            font-weight: 600;
            font-size: 13px;
            color: var(--danger);
            border: 1px solid rgba(217, 48, 37, 0.15);
        }
        .unconfirm-list .name-tag .month-badge {
            font-weight: 400;
            color: var(--gray-600);
            font-size: 11px;
            margin-left: 4px;
        }
        @keyframes pulse-border {
            0%,
            100% {
                border-color: var(--danger);
            }
            50% {
                border-color: #f5a09a;
            }
        }

        /* ===== 图表网格：上下布局 ===== */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 18px;
        }
        .chart-box {
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--gray-200);
            padding: 8px 6px 4px;
            position: relative;
            transition: var(--transition);
        }
        .chart-box:hover {
            border-color: var(--primary);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }
        .chart-box .chart-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--gray-600);
            padding: 0 8px 6px;
        }
        .chart-container {
            width: 100%;
            height: 300px;
        }
        @media (min-width: 700px) {
            .chart-container {
                height: 320px;
            }
        }
        @media (min-width: 900px) {
            .chart-container {
                height: 340px;
            }
        }

        /* ===== 明细表 ===== */
        .table-wrapper {
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            overflow: hidden;
            margin-top: 4px;
        }
        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 2px;
        }
        .table-scroll table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            table-layout: fixed;
        }
        .table-scroll th,
        .table-scroll td {
            padding: 9px 8px;
            border-bottom: 1px solid var(--gray-100);
            vertical-align: middle;
            word-break: break-word;
            text-align: center;
        }
        .table-scroll th {
            background: var(--gray-100);
            color: var(--gray-600);
            font-weight: 600;
            border-bottom: 2px solid var(--gray-200);
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .table-scroll th:nth-child(1),
        .table-scroll td:nth-child(1) { width: 16%; }
        .table-scroll th:nth-child(2),
        .table-scroll td:nth-child(2) { width: 16%; }
        .table-scroll th:nth-child(3),
        .table-scroll td:nth-child(3) { width: 20%; }
        .table-scroll th:nth-child(4),
        .table-scroll td:nth-child(4) { width: 12%; }
        .table-scroll th:nth-child(5),
        .table-scroll td:nth-child(5) { width: 12%; }
        .table-scroll th:nth-child(6),
        .table-scroll td:nth-child(6) { width: 16%; }

        .table-scroll tr:hover td {
            background: var(--gray-50);
        }
        .table-scroll .empty-row td {
            text-align: center;
            color: var(--gray-600);
            padding: 20px 0;
        }
        .badge-confirm {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge-confirm.yes {
            background: #e6f4ea;
            color: #1e7e34;
        }
        .badge-confirm.no {
            background: var(--danger-light);
            color: var(--danger);
            font-weight: 600;
        }

        /* ===== 工具条 ===== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toolbar-left span {
            font-weight: 600;
            font-size: 15px;
            color: var(--gray-600);
        }
        .toolbar-right {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .toolbar-right .upload-btn {
            padding: 5px 14px;
            font-size: 12px;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: var(--gray-600);
        }
        .empty-state .icon {
            font-size: 56px;
            margin-bottom: 12px;
        }
        .empty-state h3 {
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 6px;
        }
        .empty-state p {
            font-size: 14px;
            max-width: 300px;
            margin: 0 auto;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 420px) {
            .app {
                padding: 14px 10px 20px;
            }
            .header h1 {
                font-size: 19px;
            }
            .stat-card .value {
                font-size: 22px;
            }
            .filter-group select {
                font-size: 13px;
                padding: 4px 8px;
                min-width: 60px;
            }
            .filter-group label {
                font-size: 13px;
            }
            .upload-btn {
                font-size: 13px;
                padding: 6px 14px;
            }
            .filter-actions .upload-btn {
                font-size: 12px;
                padding: 5px 12px;
            }
        }

        /* ===== 工具类 ===== */
        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }

        /* ===== 滚动条美化 ===== */
        .table-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .table-scroll::-webkit-scrollbar-track {
            background: var(--gray-100);
            border-radius: 4px;
        }
        .table-scroll::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 4px;
        }
        .table-scroll::-webkit-scrollbar-thumb:hover {
            background: var(--gray-600);
        }

        #fileInput {
            display: none;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(26, 115, 232, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .stat-card .value.pop {
            animation: pop 0.3s ease;
        }
        @keyframes pop {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.12);
            }
            100% {
                transform: scale(1);
            }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--gray-800);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.3s ease;
            pointer-events: none;
            z-index: 999;
            max-width: 90%;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            background: var(--success);
        }
        .toast.error {
            background: var(--danger);
        }
        .toast.info {
            background: var(--primary);
        }

        .upload-btn.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- Toast -->
        <div class="toast" id="toast"></div>

        <!-- 头部 -->
        <div class="header">
            <h1>🏅 奖惩数据公示仪表盘 <small>v2.0</small></h1>
            <div class="upload-area">
                <button class="upload-btn" id="uploadBtn">📁 上传 Excel</button>
                <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" />
                <span class="file-name" id="fileName">未上传</span>
            </div>
        </div>

        <!-- 筛选栏 -->
        <div class="filters" id="filterBar">
            <div class="filter-group">
                <label>📅 年</label>
                <select id="yearSelect"><option value="">全部</option></select>
            </div>
            <div class="filter-group">
                <label>📆 月</label>
                <select id="monthSelect" disabled><option value="">全部</option></select>
            </div>
            <div class="filter-actions">
                <button class="upload-btn" id="applyFilterBtn" style="background:var(--gray-600);">应用</button>
                <button class="upload-btn secondary" id="exportBtn" title="导出筛选数据为 CSV">⬇ 导出</button>
                <button class="upload-btn danger" id="resetBtn" title="清空数据重置">✕</button>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats" id="statsArea">
            <div class="stat-card">
                <div class="label">📉 扣分总数</div>
                <div class="value danger" id="totalScore">0</div>
                <div class="sub" id="totalSub">当月 · 不统计加分 <span class="highlight" id="totalBonus">0</span></div>
            </div>
            <div class="stat-card">
                <div class="label">💰 金额总计</div>
                <div class="value success" id="totalAmount">0</div>
                <div class="sub" id="amountSub">当月</div>
            </div>
            <div class="stat-card">
                <div class="label">👤 涉及人数</div>
                <div class="value" id="personCount" style="color:var(--gray-800);">0</div>
                <div class="sub" id="personSub">当月</div>
            </div>
        </div>

        <!-- 未确认名单 -->
        <div class="unconfirm-list" id="unconfirmBox">
            <span class="label">未确认</span>
            <span class="names" id="unconfirmNames">—</span>
        </div>

        <!-- 图表网格 -->
        <div class="charts-grid">
            <div class="chart-box">
                <div class="chart-title">📈 月度分值分布</div>
                <div class="chart-container" id="trendChart"></div>
            </div>
            <div class="chart-box">
                <div class="chart-title">📊 个人分值情况</div>
                <div class="chart-container" id="barChart"></div>
            </div>
        </div>

        <!-- 明细表 -->
        <div style="margin-top:6px;">
            <div class="toolbar">
                <div class="toolbar-left">
                    <span>📋 明细数据</span>
                    <span style="font-size:13px;color:var(--gray-600);" id="rowCount">0 条</span>
                </div>
                <div class="toolbar-right">
                    <button class="upload-btn secondary" id="copyTableBtn" style="font-size:12px;padding:4px 12px;">📋 复制</button>
                </div>
            </div>
            <div class="table-wrapper">
                <div class="table-scroll" id="tableScroll">
                    <table>
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>名字</th>
                                <th>扣分项目</th>
                                <th>分值</th>
                                <th>金额</th>
                                <th>本人确认</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr class="empty-row"><td colspan="6">暂无数据</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 底部 -->
        <div style="margin-top:16px;text-align:center;font-size:12px;color:var(--gray-600);border-top:1px solid var(--gray-200);padding-top:14px;">
            📎 上传 Excel 自动生成 · 数据仅在本地处理 · 支持「扣分项目/扣分项」列名
        </div>
    </div>

    <script>
        // ================================================================
        //  全局状态
        // ================================================================
        const state = {
            rawData: [],
            filteredData: [],
            allYears: [],
            allMonths: [],
            currentYear: '',
            currentMonth: '',
            startDay: 26, // 固定
            fileName: '',
            uploadTime: null,
            barChartInstance: null,
            trendChartInstance: null,
        };

        // 密码相关
        let authorized = false;
        let lastAuthAttempt = 0;

        const $ = id => document.getElementById(id);
        const yearSelect = $('yearSelect');
        const monthSelect = $('monthSelect');
        const applyBtn = $('applyFilterBtn');
        const uploadBtn = $('uploadBtn');
        const fileInput = $('fileInput');
        const fileNameEl = $('fileName');
        const totalScore = $('totalScore');
        const totalSub = $('totalSub');
        const totalBonus = $('totalBonus');
        const totalAmount = $('totalAmount');
        const amountSub = $('amountSub');
        const personCount = $('personCount');
        const personSub = $('personSub');
        const unconfirmNames = $('unconfirmNames');
        const tableBody = $('tableBody');
        const rowCount = $('rowCount');
        const barChartEl = $('barChart');
        const trendChartEl = $('trendChart');
        const toastEl = $('toast');
        const exportBtn = $('exportBtn');
        const resetBtn = $('resetBtn');
        const copyTableBtn = $('copyTableBtn');

        // ================================================================
        //  Toast
        // ================================================================
        let toastTimer = null;

        function showToast(msg, type = 'info', duration = 2800) {
            if (toastTimer) {
                clearTimeout(toastTimer);
                toastEl.classList.remove('show', 'success', 'error', 'info');
            }
            toastEl.textContent = msg;
            toastEl.className = 'toast ' + type;
            void toastEl.offsetWidth;
            toastEl.classList.add('show');
            toastTimer = setTimeout(() => {
                toastEl.classList.remove('show');
                toastTimer = null;
            }, duration);
        }

        // ================================================================
        //  密码保护
        // ================================================================
        const PASSWORD = '123456';
        const PASSWORD_COOLDOWN = 3000;

        function checkPassword() {
            const now = Date.now();
            if (authorized) return true;
            if (now - lastAuthAttempt < PASSWORD_COOLDOWN) {
                const remaining = Math.ceil((PASSWORD_COOLDOWN - (now - lastAuthAttempt)) / 1000);
                showToast(`请等待 ${remaining} 秒后再试`, 'error');
                return false;
            }
            const input = prompt('请输入管理员密码：');
            if (input === null) return false;
            lastAuthAttempt = Date.now();
            if (input === PASSWORD) {
                authorized = true;
                showToast('✅ 授权成功', 'success');
                return true;
            } else {
                showToast('❌ 密码错误，请3秒后再试', 'error');
                return false;
            }
        }

        function withAuth(fn) {
            return function(...args) {
                if (!checkPassword()) return;
                fn.apply(this, args);
            };
        }

        // ================================================================
        //  工具函数
        // ================================================================
        function formatDateShort(d) {
            if (!d) return '';
            if (d instanceof Date) {
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${y}-${m}-${day}`;
            }
            if (typeof d === 'string') {
                const parsed = parseDateValue(d);
                if (parsed) return formatDateShort(parsed);
                if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
                const match = d.match(/^(\d{4}-\d{2}-\d{2})/);
                if (match) return match[1];
                return d;
            }
            return String(d);
        }

        function parseDateValue(v) {
            if (!v) return null;
            if (v instanceof Date) return v;
            if (typeof v === 'number') {
                const d = new Date((v - 25569) * 86400 * 1000);
                if (!isNaN(d)) return d;
            }
            if (typeof v === 'string') {
                let d = new Date(v);
                if (!isNaN(d)) return d;
                const m = v.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
                if (m) {
                    const d2 = new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
                    if (!isNaN(d2)) return d2;
                }
                const m2 = v.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
                if (m2) {
                    const d2 = new Date(parseInt(m2[3]), parseInt(m2[1]) - 1, parseInt(m2[2]));
                    if (!isNaN(d2)) return d2;
                }
            }
            return null;
        }

        function calcMonthGroup(date, startDay) {
            if (!date || !(date instanceof Date) || isNaN(date)) return null;
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            if (startDay === 1) return { year, month };
            if (day >= startDay) {
                let m = month + 1,
                    y = year;
                if (m > 12) { m = 1;
                    y = year + 1; }
                return { year: y, month: m };
            } else {
                return { year, month };
            }
        }

        function getMonthLabel(year, month) {
            return `${year}年${month}月`;
        }

        function aggregatePerson(data) {
            const map = new Map();
            data.forEach(row => {
                const name = row['名字'] || '未知';
                const score = parseFloat(row['分值']) || 0;
                const amount = parseFloat(row['金额']) || 0;
                if (!map.has(name)) {
                    map.set(name, { positive: 0, negative: 0, amount: 0 });
                }
                const cur = map.get(name);
                if (score > 0) cur.positive += score;
                else if (score < 0) cur.negative += score;
                cur.amount += amount;
            });
            return Array.from(map.entries()).map(([name, val]) => ({
                name,
                positive: val.positive,
                negative: val.negative,
                amount: val.amount,
            }));
        }

        function aggregateByMonthSplit(data, startDay) {
            const map = new Map();
            data.forEach(row => {
                const dateObj = parseDateValue(row['日期']);
                if (!dateObj) return;
                const group = calcMonthGroup(dateObj, startDay);
                if (!group) return;
                const key = `${group.year}-${String(group.month).padStart(2, '0')}`;
                const score = parseFloat(row['分值']) || 0;
                const amount = parseFloat(row['金额']) || 0;
                if (!map.has(key)) {
                    map.set(key, { year: group.year, month: group.month, positive: 0, negative: 0, amount: 0 });
                }
                const cur = map.get(key);
                if (score > 0) cur.positive += score;
                else if (score < 0) cur.negative += score;
                cur.amount += amount;
            });
            const entries = Array.from(map.entries());
            entries.sort((a, b) => a[0].localeCompare(b[0]));
            return entries.map(([key, val]) => ({
                year: val.year,
                month: val.month,
                key,
                positive: val.positive,
                negative: val.negative,
                amount: val.amount,
            }));
        }

        function getUnconfirmedRecords(data) {
            const records = [];
            data.forEach(row => {
                const confirm = (row['本人确认'] || '').toString().trim().toUpperCase();
                const name = (row['名字'] || '').toString().trim();
                if (confirm !== 'Y' && name) {
                    const dateObj = parseDateValue(row['日期']);
                    if (dateObj) {
                        const group = calcMonthGroup(dateObj, state.startDay);
                        if (group) {
                            records.push({ name, year: group.year, month: group.month });
                        } else {
                            records.push({ name, year: null, month: null });
                        }
                    } else {
                        records.push({ name, year: null, month: null });
                    }
                }
            });
            return records;
        }
