<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>奖惩数据公示仪表盘</title>
    <!-- ECharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js">
    </script>
    <!-- SheetJS CDN -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js">
    </script>
    <style>
        /* ===== 全局重置 & 变量 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #1a73e8;
            --primary-light: #e8f0fe;
            --danger: #d93025;
            --danger-light: #fce8e6;
            --success: #34a853;
            --warning: #f9ab00;
            --gray-50: #f8f9fa;
            --gray-100: #f1f3f4;
            --gray-200: #e8eaed;
            --gray-300: #dadce0;
            --gray-600: #5f6368;
            --gray-800: #202124;
            --radius: 16px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            --transition: 0.25s ease;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            font-family: var(--font);
            background: var(--gray-50);
            color: var(--gray-800);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .app {
            max-width: 430px;
            width: 100%;
            margin: 0 auto;
            background: #ffffff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px 16px 30px;
            transition: max-width 0.3s;
        }
        @media (min-width: 900px) {
            body {
                padding: 24px 40px;
                align-items: center;
            }
            .app {
                max-width: 1200px;
                padding: 28px 32px 36px;
            }
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, var(--primary), #0d47a1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 small {
            font-size: 14px;
            font-weight: 400;
            color: var(--gray-600);
            -webkit-text-fill-color: var(--gray-600);
        }
        .upload-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .upload-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .upload-btn:hover {
            background: #1557b0;
            transform: scale(1.02);
        }
        .upload-btn:active {
            transform: scale(0.96);
        }
        .upload-btn.secondary {
            background: var(--gray-600);
        }
        .upload-btn.secondary:hover {
            background: #4a4d52;
        }
        .upload-btn.danger {
            background: var(--danger);
        }
        .upload-btn.danger:hover {
            background: #b71c1c;
        }
        .file-name {
            font-size: 13px;
            color: var(--gray-600);
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ===== 筛选栏 ===== */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 14px;
            background: var(--gray-50);
            padding: 14px 16px;
            border-radius: var(--radius);
            margin-bottom: 18px;
            align-items: center;
            border: 1px solid var(--gray-200);
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }
        .filter-group label {
            color: var(--gray-600);
            font-weight: 500;
            white-space: nowrap;
        }
        .filter-group select {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--gray-300);
            background: #fff;
            font-size: 14px;
            color: var(--gray-800);
            cursor: pointer;
            outline: none;
            min-width: 70px;
        }
        .filter-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
        }
        .filter-group select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .filter-actions {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }
        .filter-actions .upload-btn {
            padding: 6px 16px;
            font-size: 13px;
        }

        /* ===== 统计卡片 (三列) ===== */
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }
        @media (max-width: 460px) {
            .stats {
                grid-template-columns: 1fr 1fr;
            }
            .stats .stat-card:last-child {
                grid-column: 1 / -1;
            }
        }
        @media (max-width: 360px) {
            .stats {
                grid-template-columns: 1fr;
            }
            .stats .stat-card:last-child {
                grid-column: 1;
            }
        }
        .stat-card {
            background: var(--gray-50);
            border-radius: var(--radius);
            padding: 12px 14px;
            border: 1px solid var(--gray-200);
            transition: var(--transition);
            position: relative;
        }
        .stat-card:hover {
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .stat-card .label {
            font-size: 12px;
            color: var(--gray-600);
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .stat-card .value {
            font-size: 26px;
            font-weight: 700;
            margin-top: 2px;
            line-height: 1.2;
        }
        .stat-card .value.primary {
            color: var(--primary);
        }
        .stat-card .value.danger {
            color: var(--danger);
        }
        .stat-card .value.success {
            color: var(--success);
        }
        .stat-card .sub {
            font-size: 12px;
            color: var(--gray-600);
            margin-top: 2px;
        }
        .stat-card .sub .highlight {
            font-weight: 600;
            color: var(--warning);
        }

        /* ===== 未确认名单 ===== */
        .unconfirm-list {
            background: var(--danger-light);
            border: 2px solid var(--danger);
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-bottom: 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
            animation: pulse-border 2s infinite;
        }
        .unconfirm-list .label {
            font-weight: 600;
            color: var(--danger);
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .unconfirm-list .label::before {
            content: "⚠️";
            font-size: 18px;
        }
        .unconfirm-list .names {
            font-weight: 600;
            color: var(--danger);
            font-size: 14px;
            word-break: break-all;
            line-height: 1.6;
        }
        .unconfirm-list .empty {
            color: var(--gray-600);
            font-weight: 400;
        }
        .unconfirm-list .name-tag {
            display: inline-block;
            background: rgba(217, 48, 37, 0.10);
            border-radius: 16px;
            padding: 2px 12px 2px 10px;
            margin: 2px 4px 2px 0;
            font-weight: 600;
            font-size: 13px;
            color: var(--danger);
            border: 1px solid rgba(217, 48, 37, 0.15);
        }
        .unconfirm-list .name-tag .month-badge {
            font-weight: 400;
            color: var(--gray-600);
            font-size: 11px;
            margin-left: 4px;
        }
        @keyframes pulse-border {
            0%,
            100% {
                border-color: var(--danger);
            }
            50% {
                border-color: #f5a09a;
            }
        }

        /* ===== 图表网格：上下布局 ===== */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 18px;
        }
        .chart-box {
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--gray-200);
            padding: 8px 6px 4px;
            position: relative;
            transition: var(--transition);
        }
        .chart-box:hover {
            border-color: var(--primary);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }
        .chart-box .chart-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--gray-600);
            padding: 0 8px 6px;
        }
        .chart-container {
            width: 100%;
            height: 300px;
        }
        @media (min-width: 700px) {
            .chart-container {
                height: 320px;
            }
        }
        @media (min-width: 900px) {
            .chart-container {
                height: 340px;
            }
        }

        /* ===== 明细表 ===== */
        .table-wrapper {
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            overflow: hidden;
            margin-top: 4px;
        }
        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 2px;
        }
        .table-scroll table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            table-layout: fixed;
        }
        .table-scroll th,
        .table-scroll td {
            padding: 9px 8px;
            border-bottom: 1px solid var(--gray-100);
            vertical-align: middle;
            word-break: break-word;
            text-align: center;
        }
        .table-scroll th {
            background: var(--gray-100);
            color: var(--gray-600);
            font-weight: 600;
            border-bottom: 2px solid var(--gray-200);
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .table-scroll th:nth-child(1),
        .table-scroll td:nth-child(1) { width: 16%; }
        .table-scroll th:nth-child(2),
        .table-scroll td:nth-child(2) { width: 16%; }
        .table-scroll th:nth-child(3),
        .table-scroll td:nth-child(3) { width: 20%; }
        .table-scroll th:nth-child(4),
        .table-scroll td:nth-child(4) { width: 12%; }
        .table-scroll th:nth-child(5),
        .table-scroll td:nth-child(5) { width: 12%; }
        .table-scroll th:nth-child(6),
        .table-scroll td:nth-child(6) { width: 16%; }

        .table-scroll tr:hover td {
            background: var(--gray-50);
        }
        .table-scroll .empty-row td {
            text-align: center;
            color: var(--gray-600);
            padding: 20px 0;
        }
        .badge-confirm {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge-confirm.yes {
            background: #e6f4ea;
            color: #1e7e34;
        }
        .badge-confirm.no {
            background: var(--danger-light);
            color: var(--danger);
            font-weight: 600;
        }

        /* ===== 工具条 ===== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toolbar-left span {
            font-weight: 600;
            font-size: 15px;
            color: var(--gray-600);
        }
        .toolbar-right {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .toolbar-right .upload-btn {
            padding: 5px 14px;
            font-size: 12px;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: var(--gray-600);
        }
        .empty-state .icon {
            font-size: 56px;
            margin-bottom: 12px;
        }
        .empty-state h3 {
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 6px;
        }
        .empty-state p {
            font-size: 14px;
            max-width: 300px;
            margin: 0 auto;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 420px) {
            .app {
                padding: 14px 10px 20px;
            }
            .header h1 {
                font-size: 19px;
            }
            .stat-card .value {
                font-size: 22px;
            }
            .filter-group select {
                font-size: 13px;
                padding: 4px 8px;
                min-width: 60px;
            }
            .filter-group label {
                font-size: 13px;
            }
            .upload-btn {
                font-size: 13px;
                padding: 6px 14px;
            }
            .filter-actions .upload-btn {
                font-size: 12px;
                padding: 5px 12px;
            }
        }

        /* ===== 工具类 ===== */
        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }

        /* ===== 滚动条美化 ===== */
        .table-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .table-scroll::-webkit-scrollbar-track {
            background: var(--gray-100);
            border-radius: 4px;
        }
        .table-scroll::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 4px;
        }
        .table-scroll::-webkit-scrollbar-thumb:hover {
            background: var(--gray-600);
        }

        #fileInput {
            display: none;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(26, 115, 232, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .stat-card .value.pop {
            animation: pop 0.3s ease;
        }
        @keyframes pop {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.12);
            }
            100% {
                transform: scale(1);
            }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--gray-800);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.3s ease;
            pointer-events: none;
            z-index: 999;
            max-width: 90%;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            background: var(--success);
        }
        .toast.error {
            background: var(--danger);
        }
        .toast.info {
            background: var(--primary);
        }

        .upload-btn.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- Toast -->
        <div class="toast" id="toast"></div>

        <!-- 头部 -->
        <div class="header">
            <h1>🏅 奖惩数据公示仪表盘 <small>v2.0</small></h1>
            <div class="upload-area">
                <button class="upload-btn" id="uploadBtn">📁 上传 Excel</button>
                <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" />
                <span class="file-name" id="fileName">未上传</span>
            </div>
        </div>

        <!-- 筛选栏 -->
        <div class="filters" id="filterBar">
            <div class="filter-group">
                <label>📅 年</label>
                <select id="yearSelect"><option value="">全部</option></select>
            </div>
            <div class="filter-group">
                <label>📆 月</label>
                <select id="monthSelect" disabled><option value="">全部</option></select>
            </div>
            <div class="filter-actions">
                <button class="upload-btn" id="applyFilterBtn" style="background:var(--gray-600);">应用</button>
                <button class="upload-btn secondary" id="exportBtn" title="导出筛选数据为 CSV">⬇ 导出</button>
                <button class="upload-btn danger" id="resetBtn" title="清空数据重置">✕</button>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats" id="statsArea">
            <div class="stat-card">
                <div class="label">📉 扣分总数</div>
                <div class="value danger" id="totalScore">0</div>
                <div class="sub" id="totalSub">当月 · 不统计加分 <span class="highlight" id="totalBonus">0</span></div>
            </div>
            <div class="stat-card">
                <div class="label">💰 金额总计</div>
                <div class="value success" id="totalAmount">0</div>
                <div class="sub" id="amountSub">当月</div>
            </div>
            <div class="stat-card">
                <div class="label">👤 涉及人数</div>
                <div class="value" id="personCount" style="color:var(--gray-800);">0</div>
                <div class="sub" id="personSub">当月</div>
            </div>
        </div>

        <!-- 未确认名单 -->
        <div class="unconfirm-list" id="unconfirmBox">
            <span class="label">未确认</span>
            <span class="names" id="unconfirmNames">—</span>
        </div>

        <!-- 图表网格 -->
        <div class="charts-grid">
            <div class="chart-box">
                <div class="chart-title">📈 月度分值分布</div>
                <div class="chart-container" id="trendChart"></div>
            </div>
            <div class="chart-box">
                <div class="chart-title">📊 个人分值情况</div>
                <div class="chart-container" id="barChart"></div>
            </div>
        </div>

        <!-- 明细表 -->
        <div style="margin-top:6px;">
            <div class="toolbar">
                <div class="toolbar-left">
                    <span>📋 明细数据</span>
                    <span style="font-size:13px;color:var(--gray-600);" id="rowCount">0 条</span>
                </div>
                <div class="toolbar-right">
                    <button class="upload-btn secondary" id="copyTableBtn" style="font-size:12px;padding:4px 12px;">📋 复制</button>
                </div>
            </div>
            <div class="table-wrapper">
                <div class="table-scroll" id="tableScroll">
                    <table>
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>名字</th>
                                <th>扣分项目</th>
                                <th>分值</th>
                                <th>金额</th>
                                <th>本人确认</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr class="empty-row"><td colspan="6">暂无数据</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 底部 -->
        <div style="margin-top:16px;text-align:center;font-size:12px;color:var(--gray-600);border-top:1px solid var(--gray-200);padding-top:14px;">
            📎 上传 Excel 自动生成 · 数据仅在本地处理 · 支持「扣分项目/扣分项」列名
        </div>
    </div>

    <script>
        // ================================================================
        //  全局状态
        // ================================================================
        const state = {
            rawData: [],
            filteredData: [],
            allYears: [],
            allMonths: [],
            currentYear: '',
            currentMonth: '',
            startDay: 26, // 固定
            fileName: '',
            uploadTime: null,
            barChartInstance: null,
            trendChartInstance: null,
        };

        // 密码相关
        let authorized = false;
        let lastAuthAttempt = 0;

        const $ = id => document.getElementById(id);
        const yearSelect = $('yearSelect');
        const monthSelect = $('monthSelect');
        const applyBtn = $('applyFilterBtn');
        const uploadBtn = $('uploadBtn');
        const fileInput = $('fileInput');
        const fileNameEl = $('fileName');
        const totalScore = $('totalScore');
        const totalSub = $('totalSub');
        const totalBonus = $('totalBonus');
        const totalAmount = $('totalAmount');
        const amountSub = $('amountSub');
        const personCount = $('personCount');
        const personSub = $('personSub');
        const unconfirmNames = $('unconfirmNames');
        const tableBody = $('tableBody');
        const rowCount = $('rowCount');
        const barChartEl = $('barChart');
        const trendChartEl = $('trendChart');
        const toastEl = $('toast');
        const exportBtn = $('exportBtn');
        const resetBtn = $('resetBtn');
        const copyTableBtn = $('copyTableBtn');

        // ================================================================
        //  Toast
        // ================================================================
        let toastTimer = null;

        function showToast(msg, type = 'info', duration = 2800) {
            if (toastTimer) {
                clearTimeout(toastTimer);
                toastEl.classList.remove('show', 'success', 'error', 'info');
            }
            toastEl.textContent = msg;
            toastEl.className = 'toast ' + type;
            void toastEl.offsetWidth;
            toastEl.classList.add('show');
            toastTimer = setTimeout(() => {
                toastEl.classList.remove('show');
                toastTimer = null;
            }, duration);
        }

        // ================================================================
        //  密码保护
        // ================================================================
        const PASSWORD = '123456';
        const PASSWORD_COOLDOWN = 3000;

        function checkPassword() {
            const now = Date.now();
            if (authorized) return true;
            if (now - lastAuthAttempt < PASSWORD_COOLDOWN) {
                const remaining = Math.ceil((PASSWORD_COOLDOWN - (now - lastAuthAttempt)) / 1000);
                showToast(`请等待 ${remaining} 秒后再试`, 'error');
                return false;
            }
            const input = prompt('请输入管理员密码：');
            if (input === null) return false;
            lastAuthAttempt = Date.now();
            if (input === PASSWORD) {
                authorized = true;
                showToast('✅ 授权成功', 'success');
                return true;
            } else {
                showToast('❌ 密码错误，请3秒后再试', 'error');
                return false;
            }
        }

        function withAuth(fn) {
            return function(...args) {
                if (!checkPassword()) return;
                fn.apply(this, args);
            };
        }

        // ================================================================
        //  工具函数
        // ================================================================
        function formatDateShort(d) {
            if (!d) return '';
            if (d instanceof Date) {
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${y}-${m}-${day}`;
            }
            if (typeof d === 'string') {
                const parsed = parseDateValue(d);
                if (parsed) return formatDateShort(parsed);
                if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
                const match = d.match(/^(\d{4}-\d{2}-\d{2})/);
                if (match) return match[1];
                return d;
            }
            return String(d);
        }

        function parseDateValue(v) {
            if (!v) return null;
            if (v instanceof Date) return v;
            if (typeof v === 'number') {
                const d = new Date((v - 25569) * 86400 * 1000);
                if (!isNaN(d)) return d;
            }
            if (typeof v === 'string') {
                let d = new Date(v);
                if (!isNaN(d)) return d;
                const m = v.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
                if (m) {
                    const d2 = new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
                    if (!isNaN(d2)) return d2;
                }
                const m2 = v.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
                if (m2) {
                    const d2 = new Date(parseInt(m2[3]), parseInt(m2[1]) - 1, parseInt(m2[2]));
                    if (!isNaN(d2)) return d2;
                }
            }
            return null;
        }

        function calcMonthGroup(date, startDay) {
            if (!date || !(date instanceof Date) || isNaN(date)) return null;
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            if (startDay === 1) return { year, month };
            if (day >= startDay) {
                let m = month + 1,
                    y = year;
                if (m > 12) { m = 1;
                    y = year + 1; }
                return { year: y, month: m };
            } else {
                return { year, month };
            }
        }

        function getMonthLabel(year, month) {
            return `${year}年${month}月`;
        }

        function aggregatePerson(data) {
            const map = new Map();
            data.forEach(row => {
                const name = row['名字'] || '未知';
                const score = parseFloat(row['分值']) || 0;
                const amount = parseFloat(row['金额']) || 0;
                if (!map.has(name)) {
                    map.set(name, { positive: 0, negative: 0, amount: 0 });
                }
                const cur = map.get(name);
                if (score > 0) cur.positive += score;
                else if (score < 0) cur.negative += score;
                cur.amount += amount;
            });
            return Array.from(map.entries()).map(([name, val]) => ({
                name,
                positive: val.positive,
                negative: val.negative,
                amount: val.amount,
            }));
        }

        function aggregateByMonthSplit(data, startDay) {
            const map = new Map();
            data.forEach(row => {
                const dateObj = parseDateValue(row['日期']);
                if (!dateObj) return;
                const group = calcMonthGroup(dateObj, startDay);
                if (!group) return;
                const key = `${group.year}-${String(group.month).padStart(2, '0')}`;
                const score = parseFloat(row['分值']) || 0;
                const amount = parseFloat(row['金额']) || 0;
                if (!map.has(key)) {
                    map.set(key, { year: group.year, month: group.month, positive: 0, negative: 0, amount: 0 });
                }
                const cur = map.get(key);
                if (score > 0) cur.positive += score;
                else if (score < 0) cur.negative += score;
                cur.amount += amount;
            });
            const entries = Array.from(map.entries());
            entries.sort((a, b) => a[0].localeCompare(b[0]));
            return entries.map(([key, val]) => ({
                year: val.year,
                month: val.month,
                key,
                positive: val.positive,
                negative: val.negative,
                amount: val.amount,
            }));
        }

        function getUnconfirmedRecords(data) {
            const records = [];
            data.forEach(row => {
                const confirm = (row['本人确认'] || '').toString().trim().toUpperCase();
                const name = (row['名字'] || '').toString().trim();
                if (confirm !== 'Y' && name) {
                    const dateObj = parseDateValue(row['日期']);
                    if (dateObj) {
                        const group = calcMonthGroup(dateObj, state.startDay);
                        if (group) {
                            records.push({ name, year: group.year, month: group.month });
                        } else {
                            records.push({ name, year: null, month: null });
                        }
                    } else {
                        records.push({ name, year: null, month: null });
                    }
                }
            });
            return records;
        }

        // ================================================================
        //  核心：加载数据（追加模式）
        // ================================================================
        function loadDataFromExcel(workbook) {
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(sheet, { defval: '' });

            if (!json || json.length === 0) {
                showToast('Excel 为空或格式不正确', 'error');
                return false;
            }

            const colMap = {};
            const headers = Object.keys(json[0]);
            const aliases = {
                '日期': ['日期', 'date', '时间', 'day', '日期时间'],
                '名字': ['名字', '姓名', 'name', '人员', '员工'],
                '扣分项目': ['扣分项目', '项目', '事项', '扣分项', 'item', '扣分事由'],
                '分值': ['分值', '分数', '扣分', 'score', 'value', '扣分值'],
                '金额': ['金额', '金额(元)', 'amount', 'money', '扣款', '扣款金额'],
                '本人确认': ['本人确认', '确认', '确认人', 'confirm', '确认状态', '是否确认']
            };

            for (const [key, aliasesList] of Object.entries(aliases)) {
                for (const h of headers) {
                    const hLower = h.trim().toLowerCase();
                    if (aliasesList.some(a => hLower === a.toLowerCase() || hLower.includes(a.toLowerCase()))) {
                        colMap[key] = h;
                        break;
                    }
                }
            }

            const critical = ['日期', '名字', '扣分项目', '分值'];
            const missingCritical = critical.filter(k => !colMap[k]);
            if (missingCritical.length > 0) {
                showToast(`找不到关键列: ${missingCritical.join('、')}`, 'error');
                return false;
            }

            const newRows = [];
            json.forEach(row => {
                const dateVal = row[colMap['日期']];
                const dateObj = parseDateValue(dateVal);
                const score = parseFloat(row[colMap['分值']]) || 0;
                let amount = parseFloat(row[colMap['金额']]);
                if (isNaN(amount) || amount === undefined || amount === null) {
                    amount = score * 5;
                }
                const name = String(row[colMap['名字']] || '').trim();
                const item = String(row[colMap['扣分项目']] || '').trim();
                const confirm = String(row[colMap['本人确认']] || '').trim();

                if (name) {
                    newRows.push({
                        '日期': dateObj || dateVal,
                        '日期原始': dateVal,
                        '名字': name,
                        '扣分项目': item || '未填写',
                        '分值': score,
                        '金额': amount,
                        '本人确认': confirm,
                    });
                }
            });

            if (newRows.length === 0) {
                showToast('未解析到有效数据（需有名字）', 'error');
                return false;
            }

            // 追加
            state.rawData = state.rawData.concat(newRows);
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            state.uploadTime = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
            fileNameEl.textContent = state.uploadTime;

            extractYearMonths(state.rawData);
            setDefaultFilter();
            applyFilters();
            showToast(`✅ 追加 ${newRows.length} 条记录，总计 ${state.rawData.length} 条`, 'success');
            return true;
        }

        function extractYearMonths(data) {
            const set = new Set();
            data.forEach(row => {
                const d = parseDateValue(row['日期']);
                if (d) {
                    const y = d.getFullYear();
                    const m = d.getMonth() + 1;
                    set.add(`${y}-${String(m).padStart(2, '0')}`);
                }
            });
            const keys = Array.from(set).sort();
            const years = new Set();
            const months = new Set();
            keys.forEach(k => {
                const [y, m] = k.split('-').map(Number);
                years.add(y);
                months.add(m);
            });
            state.allYears = Array.from(years).sort((a, b) => b - a);
            state.allMonths = Array.from(months).sort((a, b) => a - b);
        }

        function setDefaultFilter() {
            if (state.allYears.length > 0) {
                state.currentYear = state.allYears[0];
            } else {
                state.currentYear = '';
            }
            const now = new Date();
            const nowMonth = now.getMonth() + 1;
            if (state.allMonths.includes(nowMonth)) {
                state.currentMonth = nowMonth;
            } else if (state.allMonths.length > 0) {
                state.currentMonth = state.allMonths[state.allMonths.length - 1];
            } else {
                state.currentMonth = '';
            }
            if (state.currentYear && state.currentMonth) {
                const has = state.rawData.some(row => {
                    const d = parseDateValue(row['日期']);
                    if (!d) return false;
                    return d.getFullYear() === state.currentYear && (d.getMonth() + 1) === state.currentMonth;
                });
                if (!has) {
                    const latest = getLatestMonth();
                    if (latest) {
                        state.currentYear = latest.year;
                        state.currentMonth = latest.month;
                    }
                }
            }
            populateSelects();
        }

        function getLatestMonth() {
            const map = new Map();
            state.rawData.forEach(row => {
                const d = parseDateValue(row['日期']);
                if (!d) return;
                const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                const dateNum = d.getTime();
                if (!map.has(key) || dateNum > map.get(key).time) {
                    map.set(key, { year: d.getFullYear(), month: d.getMonth() + 1, time: dateNum });
                }
            });
            let latest = null;
            let latestTime = 0;
            for (const [key, val] of map) {
                if (val.time > latestTime) {
                    latestTime = val.time;
                    latest = val;
                }
            }
            return latest;
        }

        function populateSelects() {
            // 年
            yearSelect.innerHTML = '<option value="">全部</option>';
            state.allYears.forEach(y => {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y + '年';
                if (y === state.currentYear) opt.selected = true;
                yearSelect.appendChild(opt);
            });

            // 月 - 根据年份是否全部决定
            updateMonthSelect();
        }

        function updateMonthSelect() {
            const yearVal = yearSelect.value;
            const isAll = yearVal === '';
            // 清空月
            monthSelect.innerHTML = '<option value="">全部</option>';
            if (isAll) {
                // 全部年份，只显示"全部"（即禁用月份筛选）
                monthSelect.disabled = true;
                monthSelect.value = '';
                // 触发筛选（清空月）
                applyFilters();
                return;
            } else {
                monthSelect.disabled = false;
                const year = parseInt(yearVal);
                // 获取该年份下所有月份
                const monthsSet = new Set();
                state.rawData.forEach(row => {
                    const d = parseDateValue(row['日期']);
                    if (d && d.getFullYear() === year) {
                        const group = calcMonthGroup(d, state.startDay);
                        if (group && group.year === year) {
                            monthsSet.add(group.month);
                        }
                    }
                });
                const months = Array.from(monthsSet).sort((a, b) => a - b);
                months.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m;
                    opt.textContent = m + '月';
                    if (m === state.currentMonth) opt.selected = true;
                    monthSelect.appendChild(opt);
                });
                // 如果没有月份数据，则添加全部
                if (months.length === 0) {
                    monthSelect.innerHTML = '<option value="">全部</option>';
                }
                // 触发筛选（更新月份）
                applyFilters();
            }
        }

        // 年份变化时更新月份
        yearSelect.addEventListener('change', function() {
            updateMonthSelect();
        });

        // 月份变化时触发筛选
        monthSelect.addEventListener('change', function() {
            applyFilters();
        });

        // ================================================================
        //  筛选（固定起始日26）
        // ================================================================
        function applyFilters() {
            const year = parseInt(yearSelect.value) || null;
            const month = parseInt(monthSelect.value) || null;
            const startDay = 26;

            state.startDay = startDay;
            state.currentYear = year;
            state.currentMonth = month;

            let filtered = state.rawData;

            if (year !== null && month !== null) {
                filtered = filtered.filter(row => {
                    const d = parseDateValue(row['日期']);
                    if (!d) return false;
                    const group = calcMonthGroup(d, startDay);
                    if (!group) return false;
                    return group.year === year && group.month === month;
                });
            } else if (year !== null) {
                filtered = filtered.filter(row => {
                    const d = parseDateValue(row['日期']);
                    if (!d) return false;
                    const group = calcMonthGroup(d, startDay);
                    return group ? group.year === year : false;
                });
            } else {
                // year为null，只按月份？这里要求年份全部时月份也只能全部，所以month应为空
                // 不进行月份筛选
            }

            state.filteredData = filtered;
            renderAll();
            saveToCache();
        }

        // ================================================================
        //  渲染
        // ================================================================
        function renderAll() {
            const data = state.filteredData;

            let totalNeg = 0,
                totalPos = 0;
            data.forEach(r => {
                const s = parseFloat(r['分值']) || 0;
                if (s < 0) totalNeg += s;
                else if (s > 0) totalPos += s;
            });
            totalScore.textContent = totalNeg.toFixed(0);
            totalBonus.textContent = totalPos.toFixed(0);

            const totalAmountVal = data.reduce((sum, r) => sum + (parseFloat(r['金额']) || 0), 0);
            totalAmount.textContent = totalAmountVal.toFixed(0);

            const names = new Set(data.map(r => r['名字']).filter(Boolean));
            personCount.textContent = names.size;

            const unconfirmedRecords = getUnconfirmedRecords(data);
            if (unconfirmedRecords.length > 0) {
                const nameMap = new Map();
                unconfirmedRecords.forEach(rec => {
                    if (!nameMap.has(rec.name)) {
                        nameMap.set(rec.name, new Set());
                    }
                    if (rec.year !== null && rec.month !== null) {
                        nameMap.get(rec.name).add(getMonthLabel(rec.year, rec.month));
                    } else {
                        nameMap.get(rec.name).add('未知月份');
                    }
                });
                let html = '';
                for (const [name, monthSet] of nameMap) {
                    const months = Array.from(monthSet).sort();
                    const monthStr = months.map(m => `<span class="month-badge">${m}</span>`).join('');
                    html += `<span class="name-tag">${name} ${monthStr}</span>`;
                }
                unconfirmNames.innerHTML = html;
                unconfirmNames.className = 'names';
            } else {
                unconfirmNames.innerHTML = '✅ 全部已确认';
                unconfirmNames.className = 'empty';
            }

            renderTable(data);
            renderBarChart(data);
            renderTrendChart(state.rawData);

            const year = yearSelect.value;
            const month = monthSelect.value;
            let sub = '';
            if (year && month) sub = `${year}年 ${month}月`;
            else if (year) sub = `${year}年`;
            else if (month) sub = `${month}月`;
            else sub = '全部';
            totalSub.innerHTML = `${sub} · 不统计加分 <span class="highlight" id="totalBonus">${totalPos.toFixed(0)}</span>`;
            amountSub.textContent = sub;
            personSub.textContent = sub;
            rowCount.textContent = `${data.length} 条`;
        }

        // ---- 明细表（日期降序） ----
        function renderTable(data) {
            if (!data || data.length === 0) {
                tableBody.innerHTML = '<tr class="empty-row"><td colspan="6">暂无匹配数据</td></tr>';
                return;
            }
            // 按日期降序排列（最新在前）
            const sorted = [...data].sort((a, b) => {
                const da = parseDateValue(a['日期']);
                const db = parseDateValue(b['日期']);
                if (!da && !db) return 0;
                if (!da) return 1;
                if (!db) return -1;
                return db.getTime() - da.getTime();
            });

            let html = '';
            sorted.forEach(row => {
                const dateStr = formatDateShort(row['日期']);
                const confirm = (row['本人确认'] || '').toString().trim().toUpperCase();
                const confirmed = confirm === 'Y';
                html += `<tr>
                    <td>${dateStr}</td>
                    <td><strong>${row['名字']}</strong></td>
                    <td>${row['扣分项目']}</td>
                    <td>${row['分值']}</td>
                    <td>${row['金额']}</td>
                    <td><span class="badge-confirm ${confirmed ? 'yes' : 'no'}">${confirmed ? '✅ 已确认' : '❌ 未确认'}</span></td>
                </tr>`;
            });
            tableBody.innerHTML = html;
        }

        // ---- 柱形图（X轴标签隐藏） ----
        function renderBarChart(data) {
            if (!state.barChartInstance) {
                state.barChartInstance = echarts.init(barChartEl);
                window.addEventListener('resize', () => {
                    state.barChartInstance && state.barChartInstance.resize();
                });
            }

            const aggregated = aggregatePerson(data);
            aggregated.sort((a, b) => a.name.localeCompare(b.name));

            const names = aggregated.map(d => d.name);
            const positive = aggregated.map(d => d.positive);
            const negative = aggregated.map(d => d.negative);

            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' },
                    formatter: function(params) {
                        let res = `<strong>${params[0].axisValue}</strong><br/>`;
                        params.forEach(p => {
                            if (p.seriesName === '加分') {
                                res += `${p.seriesName}: +${p.value}<br/>`;
                            } else if (p.seriesName === '扣分') {
                                res += `${p.seriesName}: ${p.value}<br/>`;
                            }
                        });
                        const person = aggregated.find(d => d.name === params[0].axisValue);
                        if (person) res += `总金额: ${person.amount}`;
                        return res;
                    }
                },
                legend: {
                    data: ['加分', '扣分'],
                    top: 0,
                    right: 10,
                    textStyle: { fontSize: 13 },
                },
                grid: {
                    left: 20,
                    right: 20,
                    top: 40,
                    bottom: 30,
                    containLabel: true,
                },
                xAxis: {
                    type: 'category',
                    data: names,
                    axisLabel: { show: false },
                    axisLine: { show: true },
                    axisTick: { show: false },
                },
                yAxis: {
                    type: 'value',
                    name: '',
                    nameTextStyle: { show: false },
                    axisLabel: { fontSize: 11 },
                    splitLine: { lineStyle: { color: '#eee', type: 'dashed' } },
                },
                series: [{
                    name: '加分',
                    type: 'bar',
                    stack: 'total',
                    data: positive,
                    itemStyle: {
                        color: '#d93025',
                        borderRadius: [4, 4, 0, 0],
                    },
                    label: {
                        show: true,
                        position: 'top',
                        formatter: (p) => {
                            if (p.value === 0) return '';
                            const name = names[p.dataIndex];
                            return `${name}\n+${p.value}`;
                        },
                        fontSize: 11,
                        fontWeight: 'bold',
                        color: '#d93025',
                        lineHeight: 16,
                    },
                    barWidth: '40%',
                }, {
                    name: '扣分',
                    type: 'bar',
                    stack: 'total',
                    data: negative,
                    itemStyle: {
                        color: '#34a853',
                        borderRadius: [0, 0, 4, 4],
                    },
                    label: {
                        show: true,
                        position: 'bottom',
                        formatter: (p) => {
                            if (p.value === 0) return '';
                            const name = names[p.dataIndex];
                            return `${name}\n${p.value}`;
                        },
                        fontSize: 11,
                        fontWeight: 'bold',
                        color: '#34a853',
                        lineHeight: 16,
                    },
                    barWidth: '40%',
                }],
                animationDelay: (idx) => idx * 50,
                animationEasing: 'elasticOut',
            };

            state.barChartInstance.setOption(option, true);
            state.barChartInstance.resize();
        }

        // ---- 趋势图（单左轴，范围自适应） ----
        function renderTrendChart(allData) {
            if (!state.trendChartInstance) {
                state.trendChartInstance = echarts.init(trendChartEl);
                window.addEventListener('resize', () => {
                    state.trendChartInstance && state.trendChartInstance.resize();
                });
            }

            const monthly = aggregateByMonthSplit(allData, state.startDay);
            monthly.sort((a, b) => a.key.localeCompare(b.key));

            const xData = monthly.map(d => getMonthLabel(d.year, d.month));
            const negData = monthly.map(d => d.negative);
            const posData = monthly.map(d => d.positive);

            // 计算轴范围
            const allVals = [...negData, ...posData];
            const maxAbs = allVals.reduce((max, v) => Math.max(max, Math.abs(v)), 0);
            const axisMax = maxAbs * 1.2 || 1;
            const axisMin = -axisMax;

            // 标记点大小
            const minSize = 6,
                maxSize = 20;
            const totalMax = allVals.reduce((max, v) => Math.max(max, Math.abs(v)), 1);
            const negSizes = negData.map(v => v === 0 ? 0 : minSize + (Math.abs(v) / totalMax) * (maxSize - minSize));
            const posSizes = posData.map(v => v === 0 ? 0 : minSize + (v / totalMax) * (maxSize - minSize));

            const option = {
                tooltip: {
                    trigger: 'axis',
                    formatter: (params) => {
                        let res = `<strong>${params[0].axisValue}</strong><br/>`;
                        params.forEach(p => {
                            if (p.seriesName === '扣分') {
                                res += `${p.seriesName}: ${p.value}<br/>`;
                            } else if (p.seriesName === '加分') {
                                res += `${p.seriesName}: +${p.value}<br/>`;
                            }
                        });
                        const d = monthly.find(m => getMonthLabel(m.year, m.month) === params[0].axisValue);
                        if (d) res += `总金额: ${d.amount}`;
                        return res;
                    }
                },
                legend: {
                    data: ['扣分', '加分'],
                    top: 0,
                    right: 10,
                    textStyle: { fontSize: 13 },
                },
                grid: {
                    left: 20,
                    right: 20,
                    top: 40,
                    bottom: 30,
                    containLabel: true,
                },
                xAxis: {
                    type: 'category',
                    data: xData,
                    axisLabel: { show: false },
                    axisLine: { show: true },
                    axisTick: { show: false },
                },
                yAxis: {
                    type: 'value',
                    min: axisMin,
                    max: axisMax,
                    name: '',
                    nameTextStyle: { show: false },
                    axisLabel: { fontSize: 11 },
                    splitLine: { lineStyle: { color: '#eee', type: 'dashed' } },
                },
                series: [{
                    name: '扣分',
                    type: 'line',
                    data: negData,
                    smooth: true,
                    symbol: 'circle',
                    symbolSize: (val, params) => negSizes[params.dataIndex] || 0,
                    lineStyle: {
                        color: '#1a73e8',
                        width: 2.5,
                    },
                    itemStyle: {
                        color: '#1a73e8',
                        borderColor: '#fff',
                        borderWidth: 1.5,
                    },
                    label: {
                        show: true,
                        formatter: (params) => {
                            const d = monthly[params.dataIndex];
                            if (!d || d.negative === 0) return '';
                            return `${getMonthLabel(d.year, d.month)}\n${d.negative}`;
                        },
                        fontSize: 11,
                        fontWeight: 'bold',
                        color: '#1a73e8',
                        textShadowBlur: 2,
                        textShadowColor: 'rgba(255,255,255,0.8)',
                        position: 'bottom',
                        lineHeight: 16,
                    },
                }, {
                    name: '加分',
                    type: 'line',
                    data: posData,
                    smooth: true,
                    symbol: 'circle',
                    symbolSize: (val, params) => posSizes[params.dataIndex] || 0,
                    lineStyle: {
                        color: '#f9ab00',
                        width: 2.5,
                    },
                    itemStyle: {
                        color: '#f9ab00',
                        borderColor: '#fff',
                        borderWidth: 1.5,
                    },
                    label: {
                        show: true,
                        formatter: (params) => {
                            const d = monthly[params.dataIndex];
                            if (!d || d.positive === 0) return '';
                            return `${getMonthLabel(d.year, d.month)}\n+${d.positive}`;
                        },
                        fontSize: 11,
                        fontWeight: 'bold',
                        color: '#f9ab00',
                        textShadowBlur: 2,
                        textShadowColor: 'rgba(255,255,255,0.8)',
                        position: 'top',
                        lineHeight: 16,
                    },
                }],
                animationDelay: (idx) => idx * 80,
                animationEasing: 'cubicOut',
            };

            state.trendChartInstance.setOption(option, true);
            state.trendChartInstance.resize();
        }

        // ================================================================
        //  导出、复制、重置（需要密码）
        // ================================================================
        function exportCSV() {
            const data = state.filteredData;
            if (!data || data.length === 0) {
                showToast('没有数据可导出', 'error');
                return;
            }
            const headers = ['日期', '名字', '扣分项目', '分值', '金额', '本人确认'];
            const rows = data.map(r => [
                formatDateShort(r['日期']),
                r['名字'],
                r['扣分项目'],
                r['分值'],
                r['金额'],
                r['本人确认'] || '',
            ]);
            let csv = '\uFEFF' + headers.join(',') + '\n';
            rows.forEach(row => {
                csv += row.map(cell => {
                    if (typeof cell === 'string' && (cell.includes(',') || cell.includes('"') || cell.includes(
                            '\n'))) {
                        return `"${cell.replace(/"/g, '""')}"`;
                    }
                    return cell;
                }).join(',') + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            const fileName = `奖惩数据_${new Date().toISOString().slice(0,10)}.csv`;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
            showToast(`✅ 导出 ${data.length} 条数据`, 'success');
        }

        function copyTable() {
            const data = state.filteredData;
            if (!data || data.length === 0) {
                showToast('没有数据可复制', 'error');
                return;
            }
            let text = '日期\t名字\t扣分项目\t分值\t金额\t本人确认\n';
            data.forEach(r => {
                const dateStr = formatDateShort(r['日期']);
                const confirm = (r['本人确认'] || '').toString().trim().toUpperCase() === 'Y' ? '已确认' : '未确认';
                text += `${dateStr}\t${r['名字']}\t${r['扣分项目']}\t${r['分值']}\t${r['金额']}\t${confirm}\n`;
            });
            navigator.clipboard.writeText(text).then(() => {
                showToast(`✅ 已复制 ${data.length} 条数据`, 'success');
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast(`✅ 已复制 ${data.length} 条数据`, 'success');
            });
        }

        function resetAll() {
            if (state.rawData.length === 0) {
                showToast('已经是空状态', 'info');
                return;
            }
            if (!confirm('确定要清空所有数据吗？')) return;
            state.rawData = [];
            state.filteredData = [];
            state.allYears = [];
            state.allMonths = [];
            state.currentYear = '';
            state.currentMonth = '';
            state.startDay = 26;
            state.uploadTime = null;
            fileNameEl.textContent = '未上传';
            localStorage.removeItem('dash_data_v2');
            localStorage.removeItem('dash_startDay_v2');
            localStorage.removeItem('dash_uploadTime_v2');
            populateSelects();
            renderAll();
            showToast('已清空数据', 'info');
        }

        // ================================================================
        //  事件绑定
        // ================================================================
        uploadBtn.addEventListener('click', withAuth(function() {
            fileInput.click();
        }));

        resetBtn.addEventListener('click', withAuth(resetAll));

        fileInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const data = new Uint8Array(ev.target.result);
                    const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                    const success = loadDataFromExcel(workbook);
                    if (!success) {
                        fileInput.value = '';
                    }
                } catch (err) {
                    showToast('解析 Excel 失败: ' + err.message, 'error');
                    fileInput.value = '';
                }
            };
            reader.readAsArrayBuffer(file);
        });

        applyBtn.addEventListener('click', applyFilters);

        exportBtn.addEventListener('click', exportCSV);
        copyTableBtn.addEventListener('click', copyTable);

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (state.barChartInstance) state.barChartInstance.resize();
                if (state.trendChartInstance) state.trendChartInstance.resize();
            }, 200);
        });

        // ================================================================
        //  缓存
        // ================================================================
        function saveToCache() {
            try {
                if (state.rawData.length > 0) {
                    localStorage.setItem('dash_data_v2', JSON.stringify(state.rawData));
                    localStorage.setItem('dash_startDay_v2', String(state.startDay));
                    if (state.uploadTime) {
                        localStorage.setItem('dash_uploadTime_v2', state.uploadTime);
                    }
                } else {
                    localStorage.removeItem('dash_data_v2');
                    localStorage.removeItem('dash_startDay_v2');
                    localStorage.removeItem('dash_uploadTime_v2');
                }
            } catch (e) { /* ignore */ }
        }

        function loadFromCache() {
            try {
                const cached = localStorage.getItem('dash_data_v2');
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        state.rawData = parsed;
                        state.startDay = parseInt(localStorage.getItem('dash_startDay_v2')) || 26;
                        state.uploadTime = localStorage.getItem('dash_uploadTime_v2') || null;
                        fileNameEl.textContent = state.uploadTime || '📂 缓存数据';
                        extractYearMonths(state.rawData);
                        setDefaultFilter();
                        applyFilters();
                        return true;
                    }
                }
            } catch (e) { /* ignore */ }
            return false;
        }

        // ================================================================
        //  初始化 - 完全空状态，无演示数据
        // ================================================================
        // 尝试从缓存加载，若无则保持空状态
        if (!loadFromCache()) {
            state.rawData = [];
            state.filteredData = [];
            state.allYears = [];
            state.allMonths = [];
            state.currentYear = '';
            state.currentMonth = '';
            state.startDay = 26;
            state.uploadTime = null;
            fileNameEl.textContent = '未上传';
            populateSelects();
            renderAll();
            // 不显示任何提示，静默空状态
        }

        console.log('🏅 奖惩数据公示仪表盘 v2.0 已启动（空状态）');
        console.log('💡 支持列名: 日期, 名字, 扣分项目/扣分项, 分值, 金额, 本人确认');
        console.log('📌 分值保留正负，扣分总数仅统计负分，加分单独显示（不统计）');
        console.log('📂 数据自动缓存于浏览器本地');
        console.log('🔒 上传和重置需要密码: 123456');
        console.log('📅 起始日固定为26日，年份选“全部”时月份自动禁用');
    </script>
</body>
</html>
